[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "span"
version = "1.1.2"
description = "Utilities for SELinux policy analysis in Jupyter Notebook"
readme = "README.md"
license = {text = "BSD-3-Clause"}
authors = [
    {name = "Karl MacMillan", email = "karl@lupusmaximus.com"},
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
]
# setools is intentionally NOT listed here. The SELinux setools 4.x bindings
# are only distributed as a system package (RPM); the "setools" on PyPI is an
# unrelated project. It is provided via the system site-packages (the venv is
# built with --system-site-packages) and enforced by the RPM's Requires and
# install.sh.
dependencies = [
    "pandas>=1.3",
    "jupyter>=1.0",
    "pygments>=2.10",
    "pandoc>=1.0",
    "sh>=1.14,<2",
    "skin==0.0.7",
    "fabric>=2.6",
    "papermill>=2.3",
    "nbconvert>=6.4",
    "nbformat>=5.1",
]

[project.urls]
Homepage = "https://github.com/lupusmaximus/SPAN"
Repository = "https://github.com/lupusmaximus/SPAN"

[project.scripts]
span-module-notebooks = "span.module_notebook_builder:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["span*"]
